[project]
name = "taxbot"
version = "0.2.0a1"
description = "Local-first financial ledger and statement-ingestion foundation for Pakistan tax preparation"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
taxbot = "taxbot.cli:main"

[tool.setuptools.packages.find]
include = ["taxbot*"]
